<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - AL ILM 2026</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div id="navbar-root"></div>
    <script src="/js/init-navbar.js"></script>

    <main class="container">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>AL ILM 2026</h1>
                    <p>Connexion à la plateforme</p>
                </div>

                <div class="login-tabs">
                    <button class="tab-btn active" data-tab="admin">Admin / Jury</button>
                    <button class="tab-btn" data-tab="equipe">Équipe</button>
                </div>

                <!-- Formulaire Admin/Jury -->
                <form id="adminForm" class="login-form active">
                    <div class="form-group">
                        <label for="adminEmail">Email</label>
                        <input type="email" id="adminEmail" name="email" required placeholder="votre.email@example.com">
                    </div>

                    <div class="form-group">
                        <label for="adminPassword">Mot de passe</label>
                        <input type="password" id="adminPassword" name="password" required placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        Se connecter
                    </button>
                </form>

                <!-- Formulaire Équipe -->
                <form id="equipeForm" class="login-form">
                    <div class="form-group">
                        <label for="codeAcces">Code d'accès ou Nom de l'équipe</label>
                        <input type="text" id="codeAcces" name="code_acces" required
                            placeholder="Ex: FURQAN2026 ou AL-FURQAN">
                        <small>Entrez le code d'accès ou le nom de votre équipe</small>
                    </div>

                    <button type="submit" class="btn-primary btn-full">
                        Accéder à mon équipe
                    </button>
                </form>

                <div id="errorMessage" class="error-message"></div>

                <div class="login-footer">
                    <a href="/index.html">← Retour à l'accueil</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>
    <script src="/js/init-footer.js"></script>

    <script src="/js/api.js"></script>
    <script src="/js/public/login.js"></script>
</body>

</html>
