<!-- AL ILM 2026 - Navbar Component -->
<style>
    /* Navbar Styles */
    .alilm-navbar {
        background: #2C5F2D;
        color: white;
        padding: 0.8rem 0;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        position: relative;
        z-index: 1000;
        width: 100%;
    }

    .alilm-navbar-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 60px;
    }

    .alilm-navbar-logo {
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .alilm-navbar-logo a {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
    }

    .alilm-navbar-logo h1 {
        color: white;
        margin: 0;
        font-size: 1.6rem;
        line-height: 1.1;
        font-weight: 700;
    }

    .alilm-navbar-tagline {
        font-style: italic;
        color: #FFD700;
        margin: 0;
        font-size: 0.8rem;
        font-weight: 500;
    }

    .alilm-navbar-nav {
        display: flex;
        gap: 0.4rem;
        align-items: center;
    }

    .alilm-navbar-nav a {
        color: white;
        text-decoration: none;
        padding: 0.6rem 0.9rem;
        border-radius: 8px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        line-height: 1;
        white-space: nowrap;
        height: 42px;
    }

    .alilm-navbar-nav a:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-1px);
    }

    .alilm-navbar-nav a .alilm-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 5px;
        font-size: 1.1rem;

    }

    /* Primary Button - Yellow */
    .alilm-navbar-nav a.alilm-btn-primary {
        background-color: #FFD700 !important;
        color: #2C5F2D !important;
        background-image: none !important;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        padding-left: 1.25rem;
        padding-right: 1.25rem;
    }

    .alilm-navbar-nav a.alilm-btn-primary:hover {
        background-color: #f7cf00 !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
    }

    /* Secondary Button - Transparent with Border */
    .alilm-navbar-nav a.alilm-btn-secondary {
        background: transparent !important;
        border: 2px solid white !important;
        color: white !important;
        padding-top: 0;
        padding-bottom: 0;
    }

    .alilm-navbar-nav a.alilm-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.15) !important;
        transform: translateY(-2px);
    }

    /* Active state style */
    .alilm-navbar-nav a.active {
        background: rgba(255, 255, 255, 0.2);
        pointer-events: none;
        cursor: default;
    }

    .alilm-navbar-toggle {
        display: none;
        background: transparent;
        border: 2px solid white;
        color: white;
        padding: 0;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1.4rem;
        z-index: 1060;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }

    .alilm-navbar-toggle:active {
        transform: scale(0.92);
        background: rgba(255, 255, 255, 0.1);
    }

    .alilm-navbar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 1040;
        backdrop-filter: blur(4px);
    }

    /* Mobile Responsive */
    @media (max-width: 850px) {
        .alilm-navbar-logo h1 {
            font-size: 1.4rem;
        }

        .alilm-navbar-toggle {
            display: flex;
        }

        .alilm-navbar-nav {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background: #234d24;
            flex-direction: column;
            padding: 5.5rem 1.2rem 2rem;
            gap: 0.8rem;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -8px 0 30px rgba(0, 0, 0, 0.4);
            z-index: 1050;
            align-items: stretch;
        }

        .alilm-navbar-nav.active {
            right: 0;
        }

        .alilm-navbar-nav a {
            padding: 0 1.25rem;
            height: 52px;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            justify-content: flex-start;
            gap: 15px;
            width: 100%;
        }

        .alilm-navbar-nav a .alilm-icon {
            width: 24px;
            font-size: 1.2rem;
        }

        .alilm-navbar-nav a.alilm-btn-primary {
            margin-top: 1.2rem;
            justify-content: center;
            background-color: #FFD700 !important;
            border: none !important;
        }

        .alilm-navbar-nav a.alilm-btn-secondary {
            justify-content: center;
            margin-top: 0;
        }

        .alilm-navbar-overlay.active {
            display: block;
            width: calc(100% - 300px);
        }
    }
</style>

<header class="alilm-navbar">
    <div class="alilm-navbar-container">
        <div class="alilm-navbar-logo">
            <a href="/">
                <h1>🕌 AL ILM 2026</h1>
                <p class="alilm-navbar-tagline">Pour une identité islamique !</p>
            </a>
        </div>
        <nav class="alilm-navbar-nav" id="alilm-nav">
            <a href="/"><span class="alilm-icon"></span> Accueil</a>
            <a href="/public/calendrier.html"><span class="alilm-icon"></span> Calendrier</a>
            <a href="/public/classement.html"><span class="alilm-icon"></span> Classement</a>
            <a href="/public/inscription.html" class="alilm-btn-primary">S'inscrire</a>
            <a href="/login.html" class="alilm-btn-secondary">Connexion</a>
        </nav>
        <button class="alilm-navbar-toggle" id="alilm-toggle" aria-label="Menu">☰</button>
    </div>
</header>
<div class="alilm-navbar-overlay" id="alilm-overlay"></div>
