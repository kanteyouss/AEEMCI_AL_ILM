<!-- AL ILM 2026 - Navbar Component -->
<style>
    /* Navbar Styles */
    .alilm-navbar {
        background: #2C5F2D;
        color: white;
        padding: 0.8rem 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 10000;
        /* Elevated to stay above overlay */
        transition: all 0.3s ease;
    }

    .alilm-navbar-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 64px;
    }

    .alilm-navbar-logo {
        position: relative;
        z-index: 10100;
    }

    .alilm-navbar-logo a {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
    }

    .alilm-navbar-logo h1 {
        color: white;
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-transform: uppercase;
    }

    .alilm-navbar-tagline {
        color: #FFD700;
        margin: 0;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.9;
    }

    .alilm-navbar-nav {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    .alilm-navbar-nav a {
        color: white;
        text-decoration: none;
        padding: 0.6rem 1rem;
        border-radius: 10px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.95rem;
        position: relative;
    }

    .alilm-navbar-nav a:not(.alilm-btn-primary):not(.alilm-btn-secondary):hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-1px);
    }

    .alilm-navbar-nav a.active:not(.alilm-btn-primary):not(.alilm-btn-secondary) {
        background: rgba(255, 255, 255, 0.15);
        color: #FFD700;
    }

    /* Professional Buttons */
    .alilm-btn-primary {
        background: #FFD700 !important;
        color: #2C5F2D !important;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
    }

    .alilm-btn-primary:hover {
        background: #f7cf00 !important;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
    }

    .alilm-btn-secondary {
        border: 1.5px solid rgba(255, 255, 255, 0.4) !important;
        background: transparent !important;
    }

    .alilm-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1) !important;
        border-color: white !important;
        transform: translateY(-2px);
    }

    .alilm-navbar-toggle {
        display: none;
        background: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        cursor: pointer;
        z-index: 10200;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        padding: 0;
        /* Reset padding for perfect centering */
    }

    .alilm-navbar-toggle span {
        display: block;
        width: 22px;
        height: 2px;
        background: white;
        position: relative;
        transition: all 0.3s ease;
    }

    .alilm-navbar-toggle span::before,
    .alilm-navbar-toggle span::after {
        content: '';
        position: absolute;
        width: 22px;
        height: 2px;
        background: white;
        transition: all 0.3s ease;
        left: 0;
        /* Ensure alignment */
    }

    .alilm-navbar-toggle span::before {
        top: -7px;
    }

    .alilm-navbar-toggle span::after {
        bottom: -7px;
    }

    .alilm-navbar-toggle.active span {
        background: transparent !important;
    }

    .alilm-navbar-toggle.active span::before {
        transform: rotate(45deg);
        top: 0;
    }

    .alilm-navbar-toggle.active span::after {
        transform: rotate(-45deg);
        bottom: 0px;
    }

    /* Mobile Responsive */
    @media (max-width: 991px) {
        .alilm-navbar-toggle {
            display: flex;
        }

        .alilm-navbar-nav {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: #1B431C;
            flex-direction: column;
            padding: 90px 20px 40px;
            gap: 12px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 50px rgba(0, 0, 0, 0.6);
            z-index: 10000;
            align-items: center;
            text-align: center;
            display: flex !important;
        }

        .alilm-navbar-nav.active {
            right: 0;
            transform: translateX(0);
        }

        .alilm-navbar-nav a {
            padding: 16px 24px;
            height: auto;
            font-size: 1.1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 100%;
            justify-content: center;
            color: white !important;
            transition: all 0.2s ease;
            display: flex;
            /* Ensure centering works */
        }

        .alilm-navbar-nav a.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: #FFD700;
            color: #FFD700 !important;
        }

        .alilm-navbar-nav a.alilm-btn-primary {
            background: #FFD700 !important;
            margin-top: 20px;
            color: #1B431C !important;
            font-weight: 800;
            border: none !important;
        }

        .alilm-navbar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            z-index: 8000;
            /* Lower than navbar */
            pointer-events: auto;
        }

        .alilm-navbar-overlay.active {
            opacity: 1;
            visibility: visible;
        }
    }

    /* Ultra narrow screens (< 450px) */
    @media (max-width: 450px) {
        .alilm-navbar-container {
            padding: 0 15px;
        }

        .alilm-navbar-logo h1 {
            font-size: 1.25rem;
        }

        .alilm-navbar-tagline {
            font-size: 0.65rem;
        }

        .alilm-navbar-toggle {
            width: 40px;
            height: 40px;
        }

        .alilm-navbar-toggle span,
        .alilm-navbar-toggle span::before,
        .alilm-navbar-toggle span::after {
            width: 20px;
        }
    }
</style>

<header class="alilm-navbar">
    <div class="alilm-navbar-container">
        <div class="alilm-navbar-logo">
            <a href="/">
                <h1>AL ILM 2026</h1>
                <p class="alilm-navbar-tagline">Pour une identité islamique</p>
            </a>
        </div>
        <nav class="alilm-navbar-nav" id="alilm-nav">
            <a href="/">Accueil</a>
            <a href="/public/calendrier.html">Calendrier</a>
            <a href="/public/classement.html">Classement</a>
            <a href="/public/inscription.html" class="alilm-btn-primary">S'inscrire</a>
            <a href="/login.html" class="alilm-btn-secondary">Connexion</a>
        </nav>
        <button class="alilm-navbar-toggle" id="alilm-toggle" aria-label="Menu">
            <span></span>
        </button>
    </div>
</header>
<div class="alilm-navbar-overlay" id="alilm-overlay"></div>
